name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DEFRA_DIR: ${{ github.workspace }}/../defradb.rs
  CARGO_TERM_COLOR: always

jobs:
  build-desktop-and-test:
    name: Build ${{ matrix.target }} Library and Test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Clone defradb.rs
        run: git clone --depth=1 https://github.com/sourcenetwork/defradb.rs "$DEFRA_DIR"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler libdbus-1-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      # rustup installs the toolchain defradb.rs pins in rust-toolchain.toml
      # the first time cargo runs there.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cbindgen
        uses: taiki-e/install-action@v2
        with:
          tool: cbindgen

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.DEFRA_DIR }}
          key: ${{ matrix.target }}

      - name: Build desktop library
        run: |
          chmod +x gradlew build.sh src/main/c/build.sh
          ./build.sh --defra-dir "$DEFRA_DIR" --${{ matrix.target }}

      - name: Compile tests
        run: |
          mkdir -p test-out
          javac -cp build/libs/defradb.jar test/DefraTest.java test/DefraApiTest.java -d test-out

      - name: Run smoke test
        run: java -cp build/libs/defradb.jar:test-out DefraTest

      # The remote-signer check signs blocks with P-256, which defradb.rs
      # refuses by default because Go peers cannot verify ES256 block signatures.
      - name: Run API test
        env:
          DEFRA_ALLOW_NON_GO_VERIFIABLE_SIGNING: '1'
        run: java -Xcheck:jni -cp build/libs/defradb.jar:test-out DefraApiTest

  build-android:
    name: Build Android Library and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Clone defradb.rs
        run: git clone --depth=1 https://github.com/sourcenetwork/defradb.rs "$DEFRA_DIR"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cbindgen
        uses: taiki-e/install-action@v2
        with:
          tool: cbindgen

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.DEFRA_DIR }}
          key: android

      - name: Build Android library
        run: |
          chmod +x gradlew build.sh src/main/c/build.sh
          ./build.sh --defra-dir "$DEFRA_DIR" --android
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Stage AAR for instrumented test module
        run: |
          mkdir -p androidTest/libs
          cp build/outputs/aar/*-release.aar androidTest/libs/defradb.aar

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: cd androidTest && ../gradlew connectedAndroidTest
